backend:
  name: git-gateway
  branch: main

media_folder: "public/imagenes/novedades"
public_folder: "/imagenes/novedades"

collections:
  - name: "novedades"
    label: "Novedades del Taller"
    folder: "src/novedades"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    fields:
      - {label: "Título", name: "title", widget: "string"}
      - {label: "Fecha", name: "date", widget: "datetime", format: "YYYY-MM-DD"}
      - {label: "Imagen (Opcional)", name: "image", widget: "image", required: false}
      - {label: "Texto del anuncio", name: "body", widget: "markdown"}